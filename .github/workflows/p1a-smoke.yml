# Smoke for the Stage-2 lane (pool rule B4: 1-min-class deterministic task first —
# here 2 single-combo jobs proving push -> run -> artifact before the matrix).
# Durable spec; live copy pushed to .github/workflows/p1a-smoke.yml, deleted
# after green. Real matrix: p1a-matrix.yml.
name: p1a-smoke
on:
  workflow_dispatch:
    inputs:
      ref_note:
        description: ledger note
        required: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            seed: 321
            arm: staged
          - shard: 1
            seed: 321
            arm: constant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: run combo
        run: |
          mkdir -p ledgers
          node src/lab/run-p1a.js --seed ${{ matrix.seed }} --arm ${{ matrix.arm }} --out ledgers/ledger-${{ matrix.seed }}-${{ matrix.arm }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.shard }}
          path: ledgers/
