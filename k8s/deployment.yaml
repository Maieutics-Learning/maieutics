apiVersion: apps/v1
kind: Deployment
metadata:
  name: latent-lab
  labels:
    app: latent-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: latent-lab
  template:
    metadata:
      labels:
        app: latent-lab
    spec:
      containers:
        - name: web
          # Replace with your ECR image after `docker build` + `docker push`.
          image: YOUR_ECR_REPO/latent-lab:offline
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: latent-lab
  labels:
    app: latent-lab
spec:
  selector:
    app: latent-lab
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
